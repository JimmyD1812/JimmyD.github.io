<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>World Codex — moved</title>
  <meta http-equiv="refresh" content="0; url=/codex/">
  <link rel="canonical" href="https://jimmyd.space/codex/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/jimmyd-theme.css">
  <link rel="stylesheet" href="/codex/fonts/fonts.css">
  <style>
    :root {
      --parchment:#EEE5CE; --paper:#F7F2E5; --card:#FDF1DC; --ink:#241a10; --body-ink:#33261a;
      --muted:#7a6a55; --titlered:#58180D; --rulered:#9C2B1B; --ribbon:#E69A28;
      --gold:#B89A67; --gold-bright:#C9AD6A; --line:#D8C9A3; --tan:#E5D5AC;
      --header-bg:#171009;
      --title-font:'Nodesto Caps Condensed','Cinzel',serif;
      --display:'Mr Eaves Small Caps','Cinzel',serif;
      --body:'Bookinsanity','EB Garamond',Georgia,serif;
      --label-caps:'Scaly Sans Caps','Scaly Sans',sans-serif;
      --flavor:'IM Fell English',Georgia,serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--parchment);
      color: var(--body-ink);
      font-family: var(--body);
      background-image:
        radial-gradient(1200px 500px at 50% -80px, rgba(184,154,103,.20), transparent 70%),
        repeating-linear-gradient(43deg, rgba(88,24,13,.016) 0 2px, transparent 2px 5px),
        repeating-linear-gradient(-41deg, rgba(88,24,13,.014) 0 2px, transparent 2px 6px);
    }
    header.site {
      background: var(--header-bg);
      color: #F3E5C0;
      text-align: center;
      padding: 24px 20px 20px;
      border-bottom: 3px solid var(--gold-bright);
      box-shadow: 0 4px 0 var(--rulered), 0 10px 24px rgba(23,16,9,.35);
    }
    .m-title {
      font-family: var(--title-font);
      font-weight: 400;
      font-size: 2.5rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #F3E5C0;
      text-shadow: 0 2px 0 #000;
    }
    .m-orn { color: var(--ribbon); letter-spacing: .9em; font-size: .76rem; margin-top: 6px; }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px 20px;
    }
    .notice {
      max-width: 480px;
      width: 100%;
      background: var(--paper);
      border: 1px solid var(--line);
      border-top: 3px solid var(--titlered);
      border-radius: 4px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(36,26,16,.1);
    }
    .notice h1 {
      font-family: var(--display);
      font-weight: 400;
      font-size: 1.45rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--titlered);
      margin-bottom: 10px;
    }
    .notice p { color: var(--body-ink); font-size: 1.04rem; margin-bottom: 18px; }
    .notice a.cta {
      display: inline-block;
      background: var(--titlered);
      border: 1px solid var(--titlered);
      color: var(--paper);
      text-decoration: none;
      padding: 9px 18px;
      border-radius: 3px;
      font-family: var(--label-caps);
      font-size: .82rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      transition: background .15s;
    }
    .notice a.cta:hover { background: var(--rulered); border-color: var(--rulered); }
  </style>
</head>
<body>
  <header class="site">
    <div class="m-title">The World Codex</div>
    <div class="m-orn" aria-hidden="true">◆ ◆ ◆</div>
  </header>
  <main>
    <div class="notice">
      <h1>The World Codex has moved</h1>
      <p>You should be redirected automatically. If not, follow the link below:</p>
      <a class="cta" href="/codex/">jimmyd.space/codex/</a>
    </div>
  </main>
</body>
</html>
