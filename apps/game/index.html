<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Codex</title>
<style>
  :root{
    --bg:#f3ead6; --paper:#faf5e9; --ink:#2b2118; --muted:#7a6a55;
    --brass:#a07d2c; --brass-dark:#7d611f; --line:#ddd0b4; --card:#fffaf0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
  header.site{background:#241a10;color:#f3ead6;padding:26px 20px 20px;text-align:center;border-bottom:4px solid var(--brass)}
  header.site h1{margin:0;font-size:2rem;letter-spacing:.04em;font-weight:normal}
  header.site p{margin:6px 0 0;color:#cdbd97;font-style:italic}
  .wrap{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
  .layout{display:grid;grid-template-columns:250px 1fr;gap:22px}
  @media (max-width:760px){.layout{grid-template-columns:1fr}}
  aside .box, main .box{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:16px}
  aside h3, main h3{margin:2px 0 10px;font-size:.95rem;text-transform:uppercase;letter-spacing:.09em;color:var(--brass-dark)}
  input[type=search],select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;font-family:inherit;font-size:.95rem}
  .cat-btn{display:block;width:100%;text-align:left;background:none;border:none;padding:6px 8px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:1rem;color:var(--ink)}
  .cat-btn:hover{background:#f0e6cd}.cat-btn.active{background:#eadfc2;font-weight:bold}
  .cat-btn .n{color:var(--muted);font-size:.85em;float:right}
  .tag{display:inline-block;border:1px solid var(--brass);color:var(--brass-dark);border-radius:999px;padding:1px 9px;margin:2px 2px 2px 0;font-size:.8rem;cursor:pointer;background:none;font-family:inherit}
  .tag:hover,.tag.active{background:var(--brass);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px;cursor:pointer}
  .card:hover{border-color:var(--brass)}
  .card h4{margin:0 0 4px;font-size:1.15rem}
  .card .meta{color:var(--muted);font-size:.85rem;margin-bottom:6px}
  .card p{margin:0;color:#4a3d2c}
  .pin{color:var(--brass-dark);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}
  article.reader h2{margin:0 0 4px;font-size:1.9rem;font-weight:normal}
  article.reader .meta{color:var(--muted);margin-bottom:14px}
  article.reader .summary{font-style:italic;font-size:1.08rem;border-left:3px solid var(--brass);padding-left:12px;margin:0 0 18px;color:#4a3d2c}
  article.reader .body p{line-height:1.65;margin:0 0 14px;white-space:pre-wrap}
  a.xlink{color:var(--brass-dark);text-decoration:none;border-bottom:1px dotted var(--brass);cursor:pointer}
  a.xlink:hover{color:var(--ink)}
  .back{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font-family:inherit;margin-bottom:14px}
  .tl-item{border-left:3px solid var(--brass);padding:2px 0 2px 14px;margin:0 0 16px;position:relative}
  .tl-item .when{color:var(--brass-dark);font-size:.85rem;text-transform:uppercase;letter-spacing:.07em}
  .tl-item h4{margin:2px 0 4px}.tl-item p{margin:0;color:#4a3d2c;line-height:1.55}
  .dice-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .dice-row button{background:var(--brass);color:#fff;border:none;border-radius:6px;padding:8px 14px;cursor:pointer;font-family:inherit;font-size:.95rem}
  .dice-row button:hover{background:var(--brass-dark)}
  .dice-result{font-size:1.5rem;margin-top:10px}
  .dice-hist{color:var(--muted);font-size:.9rem;margin-top:6px;line-height:1.5}
  .empty{color:var(--muted);font-style:italic;padding:18px 0}
  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tabs button{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 16px;cursor:pointer;font-family:inherit;font-size:.95rem}
  .tabs button.active{background:#241a10;color:#f3ead6;border-color:#241a10}
</style>
</head>
<body>
<header class="site">
  <h1>World Codex</h1>
  <p>The world, as the players are allowed to know it.</p>
</header>
<div class="wrap">
  <div class="tabs">
    <button id="tab-articles" class="active" onclick="showTab('articles')">Articles</button>
    <button id="tab-timeline" onclick="showTab('timeline')">Timeline</button>
    <button id="tab-dice" onclick="showTab('dice')">Dice Roller</button>
  </div>
  <div id="view-articles">
    <div class="layout">
      <aside>
        <div class="box">
          <h3>Search</h3>
          <input type="search" id="q" placeholder="Search articles…" oninput="renderList()">
        </div>
        <div class="box">
          <h3>Categories</h3>
          <div id="cats"></div>
        </div>
        <div class="box">
          <h3>Type</h3>
          <select id="typeFilter" onchange="renderList()"><option value="">All types</option></select>
        </div>
        <div class="box">
          <h3>Tags</h3>
          <div id="tags"></div>
        </div>
      </aside>
      <main>
        <div id="list"></div>
        <div id="reader" style="display:none"></div>
      </main>
    </div>
  </div>
  <div id="view-timeline" style="display:none"></div>
  <div id="view-dice" style="display:none">
    <div class="box" style="background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:16px">
      <h3 style="margin-top:0;color:var(--brass-dark);text-transform:uppercase;letter-spacing:.09em;font-size:.95rem">Dice Roller</h3>
      <div class="dice-row">
        <select id="die" style="width:auto">
          <option value="4">d4</option><option value="6">d6</option><option value="8">d8</option>
          <option value="10">d10</option><option value="12">d12</option>
          <option value="20" selected>d20</option><option value="100">d100</option>
        </select>
        <input type="number" id="count" value="1" min="1" max="20" style="width:64px;padding:8px;border:1px solid var(--line);border-radius:6px">
        <span>dice, modifier</span>
        <input type="number" id="mod" value="0" style="width:64px;padding:8px;border:1px solid var(--line);border-radius:6px">
        <button onclick="roll()">Roll</button>
      </div>
      <div class="dice-result" id="diceResult"></div>
      <div class="dice-hist" id="diceHist"></div>
    </div>
  </div>
</div>
<script src="player-data.js"></script>
<script>
const DATA = window.PLAYER_DATA;
const byTitle = {}; DATA.articles.forEach(a => byTitle[a.title] = a);
const catName = id => (DATA.categories.find(c => c.id === id) || {}).name || "Uncategorised";
let activeCat = null, activeTag = null;

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function linkify(text){
  return esc(text).replace(/\[\[([^\]]+)\]\]/g, (m, t) =>
    byTitle[t] ? `<a class="xlink" onclick="openArticle(${byTitle[t].id})">${esc(t)}</a>` : esc(t));
}
function showTab(name){
  ["articles","timeline","dice"].forEach(t => {
    document.getElementById("view-"+t).style.display = t === name ? "" : "none";
    document.getElementById("tab-"+t).classList.toggle("active", t === name);
  });
  if (name === "timeline") renderTimeline();
}
function renderCats(){
  const el = document.getElementById("cats");
  let h = `<button class="cat-btn ${activeCat===null?'active':''}" onclick="setCat(null)">All articles<span class="n">${DATA.articles.length}</span></button>`;
  [...DATA.categories].sort((a,b)=>a.sortOrder-b.sortOrder).forEach(c => {
    const n = DATA.articles.filter(a => a.categoryId === c.id).length;
    h += `<button class="cat-btn ${activeCat===c.id?'active':''}" onclick="setCat(${c.id})">${esc(c.name)}<span class="n">${n}</span></button>`;
  });
  el.innerHTML = h;
}
function renderTags(){
  const all = [...new Set(DATA.articles.flatMap(a => a.tags))].sort();
  document.getElementById("tags").innerHTML = all.map(t =>
    `<button class="tag ${activeTag===t?'active':''}" onclick="setTag('${esc(t)}')">${esc(t)}</button>`).join("");
}
function renderTypes(){
  const sel = document.getElementById("typeFilter");
  [...new Set(DATA.articles.map(a => a.type))].sort().forEach(t => {
    const o = document.createElement("option"); o.value = t; o.textContent = t; sel.appendChild(o);
  });
}
function setCat(id){ activeCat = id; renderCats(); renderList(); }
function setTag(t){ activeTag = activeTag === t ? null : t; renderTags(); renderList(); }
function filtered(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const ty = document.getElementById("typeFilter").value;
  return DATA.articles.filter(a =>
    (activeCat === null || a.categoryId === activeCat) &&
    (!ty || a.type === ty) &&
    (!activeTag || a.tags.includes(activeTag)) &&
    (!q || (a.title + " " + a.summary + " " + a.body + " " + a.tags.join(" ")).toLowerCase().includes(q))
  ).sort((a,b) => (b.pinned - a.pinned) || a.title.localeCompare(b.title));
}
function renderList(){
  document.getElementById("reader").style.display = "none";
  const el = document.getElementById("list"); el.style.display = "";
  const items = filtered();
  el.innerHTML = items.length ? items.map(a => `
    <div class="card" onclick="openArticle(${a.id})">
      ${a.pinned ? '<div class="pin">★ Featured</div>' : ''}
      <h4>${esc(a.title)}</h4>
      <div class="meta">${esc(a.type)} · ${esc(catName(a.categoryId))}</div>
      <p>${esc(a.summary)}</p>
    </div>`).join("") : '<div class="empty">No articles match. Try a different search.</div>';
}
function openArticle(id){
  const a = DATA.articles.find(x => x.id === id); if (!a) return;
  document.getElementById("list").style.display = "none";
  const r = document.getElementById("reader"); r.style.display = "";
  r.innerHTML = `
    <button class="back" onclick="renderList()">← All articles</button>
    <article class="reader">
      <h2>${esc(a.title)}</h2>
      <div class="meta">${esc(a.type)} · ${esc(catName(a.categoryId))} · ${a.tags.map(t => `<span class="tag" onclick="setTag('${esc(t)}');renderList()">${esc(t)}</span>`).join(" ")}</div>
      <p class="summary">${esc(a.summary)}</p>
      <div class="body">${a.body.split(/\n\s*\n/).map(p => `<p>${linkify(p)}</p>`).join("")}</div>
    </article>`;
  window.scrollTo(0, 0);
}
function renderTimeline(){
  const el = document.getElementById("view-timeline");
  const evs = [...DATA.timeline].sort((a,b) => a.sortKey - b.sortKey);
  el.innerHTML = `<div style="background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px">` +
    evs.map(e => `<div class="tl-item"><div class="when">${esc(e.whenLabel)}</div><h4>${esc(e.title)}</h4><p>${esc(e.description)}</p>${e.articleId && byTitle[DATA.articles.find(a=>a.id===e.articleId)?.title] ? `<p style="margin-top:6px"><a class="xlink" onclick="showTab('articles');openArticle(${e.articleId})">Read more →</a></p>` : ''}</div>`).join("") + `</div>`;
}
let hist = [];
function roll(){
  const sides = +document.getElementById("die").value, n = Math.max(1, Math.min(20, +document.getElementById("count").value || 1)), mod = +document.getElementById("mod").value || 0;
  const rolls = Array.from({length:n}, () => 1 + Math.floor(Math.random() * sides));
  const total = rolls.reduce((a,b) => a+b, 0) + mod;
  document.getElementById("diceResult").textContent = total;
  const line = `${n}d${sides}${mod ? (mod > 0 ? "+"+mod : mod) : ""}: [${rolls.join(", ")}]${mod ? " " + (mod>0?"+ ":"− ") + Math.abs(mod) : ""} = ${total}`;
  hist.unshift(line);
  document.getElementById("diceHist").innerHTML = hist.slice(0, 8).map(esc).join("<br>");
}
renderCats(); renderTags(); renderTypes(); renderList();
</script>
</body>
</html>
