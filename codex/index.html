<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Codex</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root{
    --parchment:#EEE5CE; --paper:#F7F2E5; --card:#FDF1DC; --ink:#241a10; --body-ink:#33261a;
    --muted:#7a6a55; --titlered:#58180D; --rulered:#9C2B1B; --ribbon:#E69A28;
    --gold:#B89A67; --gold-bright:#C9AD6A; --line:#D8C9A3; --tan:#E5D5AC;
    --header-bg:#171009;
    --display:'Cinzel',serif; --body:'EB Garamond',Georgia,serif; --flavor:'IM Fell English',Georgia,serif;
  }
  *{box-sizing:border-box}
  ::selection{background:#58180D;color:#F7F2E5}
  body{margin:0;color:var(--ink);font-family:var(--body);font-size:1.06rem;
    background-color:var(--parchment);
    background-image:
      radial-gradient(1200px 500px at 50% -80px, rgba(184,154,103,.20), transparent 70%),
      radial-gradient(900px 600px at 110% 110%, rgba(88,24,13,.07), transparent 60%),
      radial-gradient(700px 500px at -10% 60%, rgba(88,24,13,.05), transparent 60%),
      repeating-linear-gradient(43deg, rgba(88,24,13,.016) 0 2px, transparent 2px 5px),
      repeating-linear-gradient(-41deg, rgba(88,24,13,.014) 0 2px, transparent 2px 6px);}
  header.site{background:var(--header-bg);color:#f3e5c0;text-align:center;padding:34px 20px 24px;
    border-bottom:3px solid var(--gold-bright);box-shadow:0 4px 0 var(--titlered), 0 10px 24px rgba(23,16,9,.35)}
  header.site h1{margin:0;font-family:var(--display);font-weight:900;font-size:2.7rem;letter-spacing:.14em;
    text-transform:uppercase;color:#F3E5C0;text-shadow:0 2px 0 #000, 0 0 26px rgba(230,154,40,.25)}
  header.site .orn{color:var(--ribbon);letter-spacing:.9em;font-size:.8rem;margin-top:10px}
  header.site p{margin:8px 0 0;color:#cdbd97;font-family:var(--flavor);font-style:italic;font-size:1.12rem}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
  .layout{display:grid;grid-template-columns:250px 1fr;gap:22px}
  @media (max-width:760px){.layout{grid-template-columns:1fr} header.site h1{font-size:1.9rem}}
  aside .box, main .box{background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--titlered);
    border-radius:4px;padding:14px 16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(36,26,16,.08)}
  aside h3, main h3{margin:2px 0 10px;font-family:var(--display);font-weight:700;font-size:.92rem;
    text-transform:uppercase;letter-spacing:.12em;color:var(--titlered);border-bottom:1px solid var(--gold);padding-bottom:6px}
  input[type=search],select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:#fffdf6;font-family:inherit;font-size:.98rem}
  input[type=search]:focus,select:focus{outline:2px solid var(--gold-bright);outline-offset:1px}
  .cat-btn{display:block;width:100%;text-align:left;background:none;border:none;padding:6px 8px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:1.02rem;color:var(--ink)}
  .cat-btn:hover{background:#efe3c2}.cat-btn.active{background:var(--tan);font-weight:600;box-shadow:inset 3px 0 0 var(--titlered)}
  .cat-btn .n{color:var(--muted);font-size:.85em;float:right}
  .tag{display:inline-block;border:1px solid var(--titlered);color:var(--titlered);border-radius:999px;padding:1px 10px;margin:2px 2px 2px 0;font-size:.82rem;cursor:pointer;background:none;font-family:inherit}
  .tag:hover,.tag.active{background:var(--titlered);color:#F7F2E5}
  .card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin-bottom:12px;cursor:pointer;box-shadow:0 1px 3px rgba(36,26,16,.08);transition:border-color .15s, box-shadow .15s, transform .15s}
  .card:hover{border-color:var(--gold);box-shadow:0 4px 14px rgba(36,26,16,.14);transform:translateY(-1px)}
  .card.featured{border:1px solid var(--gold);box-shadow:0 0 0 1px var(--gold-bright), 0 4px 16px rgba(36,26,16,.14);overflow:hidden;padding-top:20px}
  .card.featured::before{content:"";position:absolute;top:0;left:0;right:0;height:7px;background:linear-gradient(90deg, var(--titlered), var(--ribbon) 30%, var(--gold-bright) 50%, var(--ribbon) 70%, var(--titlered))}
  .card h4{margin:0 0 4px;font-family:var(--display);font-weight:700;font-size:1.22rem;color:var(--ink)}
  .card .meta{color:var(--muted);font-size:.82rem;text-transform:uppercase;letter-spacing:.09em;margin-bottom:6px}
  .card p{margin:0;color:var(--body-ink);line-height:1.5}
  .pin{color:#8a6a14;font-family:var(--display);font-weight:700;font-size:.74rem;text-transform:uppercase;letter-spacing:.14em;margin-bottom:4px}
  article.reader h2{margin:0 0 6px;font-family:var(--display);font-weight:900;font-size:2.15rem;color:var(--titlered);line-height:1.12}
  article.reader .meta{color:var(--muted);margin-bottom:14px;font-size:.95rem}
  article.reader .summary{font-family:var(--flavor);font-style:italic;font-size:1.14rem;background:var(--paper);
    border:1px solid var(--gold);border-left:5px solid var(--titlered);padding:12px 16px;margin:0 0 20px;color:#4a3d2c}
  article.reader .body p{line-height:1.68;margin:0 0 14px;white-space:pre-wrap;color:var(--body-ink);font-size:1.07rem}
  article.reader .body > p:first-of-type::first-letter{font-family:var(--display);font-weight:900;font-size:3.3em;float:left;
    line-height:.82;padding:5px 10px 0 0;color:var(--titlered)}
  /* — markdown-lite article elements — */
  article.reader .body .md-h1{font-family:var(--display);font-weight:400;color:var(--titlered);font-size:1.72rem;line-height:1.2;margin:26px 0 10px;padding-bottom:5px;border-bottom:2px solid var(--titlered)}
  article.reader .body .md-h2{font-family:var(--display);font-weight:400;color:var(--titlered);font-size:1.38rem;line-height:1.25;margin:22px 0 8px;padding-bottom:3px;border-bottom:1px solid var(--gold)}
  article.reader .body .md-h3{font-family:'Scaly Sans Caps','Scaly Sans',sans-serif;color:var(--titlered);font-size:1rem;letter-spacing:.05em;margin:18px 0 6px}
  .md-hr{text-align:center;color:var(--gold-bright);letter-spacing:.6em;font-size:.8rem;margin:20px 0}
  blockquote.md-quote{margin:16px 0;padding:2px 0 2px 16px;border-left:3px solid var(--gold-bright);font-family:var(--flavor);font-style:italic;font-size:1.08rem;line-height:1.55;color:#4a3d2c;white-space:pre-wrap}
  blockquote.md-quote .qattr{display:block;margin-top:6px;font-style:normal;font-family:'Scaly Sans Caps','Scaly Sans',sans-serif;font-size:.85rem;letter-spacing:.05em;color:var(--titlered);text-align:right}
  .aloud{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--ribbon);border-bottom:3px solid var(--ribbon);padding:12px 16px;margin:16px 0;line-height:1.6;white-space:pre-wrap;box-shadow:0 1px 4px rgba(36,26,16,.12)}
  article.reader .body ul.md-list,article.reader .body ol.md-list{margin:4px 0 14px 24px;line-height:1.6;padding:0}
  .md-list li{margin:3px 0}
  table.md-table{border-collapse:collapse;width:100%;margin:14px 0;font-size:.98rem;line-height:1.45}
  table.md-table th{font-family:'Scaly Sans Caps','Scaly Sans',sans-serif;font-weight:400;background:var(--tan);color:var(--titlered);text-align:left;padding:6px 10px;border-bottom:2px solid var(--titlered)}
  table.md-table td{padding:5px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  table.md-table tbody tr:nth-child(even){background:rgba(184,154,103,.13)}
  .toc{background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--titlered);padding:12px 16px;margin:18px 0}
  .toc-h{font-family:'Scaly Sans Caps','Scaly Sans',sans-serif;letter-spacing:.08em;color:var(--titlered);margin-bottom:5px}
  .toc a{display:block;cursor:pointer;color:#5a4632;padding:2px 0}
  .toc a:hover{color:var(--rulered);text-decoration:underline}
  .toc a.toc-l2{padding-left:16px}.toc a.toc-l3{padding-left:32px}
  .cover-img,.body-img{display:block;background:var(--paper);padding:6px;border:1px solid var(--gold);box-shadow:0 3px 12px rgba(36,26,16,.18)}
  .cover-img{width:100%;max-height:430px;object-fit:cover;margin:0 0 18px}
  .body-img{max-width:100%;margin:8px auto}
  .card-img{display:block;width:100%;height:150px;object-fit:cover;border:1px solid var(--gold);margin-bottom:10px}
  /* — Monster Manual statblock — */
  .sb-card{background:var(--card);border-top:7px solid var(--ribbon);border-bottom:7px solid var(--ribbon);
    box-shadow:inset 0 0 0 1px rgba(23,16,9,.4), 0 2px 8px rgba(36,26,16,.15);padding:12px 16px 14px;margin:14px 0;max-width:480px}
  .sb-name{font-family:var(--display);font-weight:900;color:var(--titlered);letter-spacing:.04em;font-size:1.32rem;margin:0}
  .sb-rule{height:5px;background:var(--rulered);margin:7px 0 9px;clip-path:polygon(0 38%, 96.5% 38%, 100% 50%, 96.5% 62%, 0 62%)}
  .sb-row{display:flex;justify-content:space-between;gap:14px;padding:2.5px 0;border-bottom:1px dotted #c9b083}
  .sb-row:last-child{border-bottom:none}
  .sb-k{font-weight:600;color:var(--titlered);font-variant:small-caps;letter-spacing:.03em}
  .sb-v{text-align:right;color:var(--body-ink)}
  a.xlink{color:var(--rulered);text-decoration:none;border-bottom:1px dotted var(--gold);cursor:pointer;font-weight:600}
  a.xlink:hover{color:var(--titlered)}
  .back{background:none;border:1px solid var(--titlered);color:var(--titlered);border-radius:4px;padding:6px 14px;cursor:pointer;font-family:var(--display);font-weight:700;font-size:.82rem;letter-spacing:.06em;margin-bottom:14px}
  .back:hover{background:var(--titlered);color:#F7F2E5}
  .empty{color:var(--muted);font-family:var(--flavor);font-style:italic;padding:18px 0;font-size:1.05rem}
  .tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .tabs button{background:transparent;border:1px solid #b39d64;color:var(--titlered);border-radius:4px;padding:7px 18px;cursor:pointer;
    font-family:var(--display);font-weight:700;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase}
  .tabs button:hover{border-color:var(--titlered)}
  .tabs button.active{background:var(--titlered);color:#F7F2E5;border-color:var(--titlered)}
  .panel{background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--titlered);border-radius:4px;padding:18px;box-shadow:0 1px 3px rgba(36,26,16,.08)}
  .panel h3{margin:0 0 12px;font-family:var(--display);font-weight:700;font-size:.95rem;text-transform:uppercase;letter-spacing:.12em;color:var(--titlered);border-bottom:1px solid var(--gold);padding-bottom:6px}
  footer.site{text-align:center;color:var(--muted);padding:10px 0 34px;font-family:var(--flavor);font-style:italic}
  footer.site .orn{color:var(--ribbon);letter-spacing:.9em;font-size:.75rem;font-style:normal;margin-bottom:6px}
  /* — Dice roller (Google-style tray) — */
  .dice-total{text-align:center;font-family:var(--display);font-weight:900;font-size:3.2rem;color:var(--titlered);line-height:1;min-height:3.4rem}
  .dice-total small{display:block;font-size:.78rem;letter-spacing:.16em;color:var(--muted);font-weight:700;margin-bottom:2px}
  .dice-tray{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;min-height:108px;padding:12px 8px;
    background:radial-gradient(ellipse at 50% 42%, #e7d6ac, #dcc794);border:1px solid #b39d64;border-radius:6px;box-shadow:inset 0 3px 14px rgba(88,24,13,.28), inset 0 -1px 4px rgba(247,242,229,.7)}
  .dice-empty{color:var(--muted);font-family:var(--flavor);font-style:italic;font-size:1.05rem}
  .die{position:relative;width:78px;height:78px;cursor:pointer;flex:none;transition:transform .12s}
  .die:hover{transform:scale(1.07)}
  .die svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 4px rgba(23,16,9,.35))}
  .die .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:1.28rem;color:#FDF1DC;text-shadow:0 1px 2px rgba(0,0,0,.55);pointer-events:none}
  .die .val.crit{color:#ffd968}.die .val.fumble{color:#ff9a8a}
  @keyframes tumble{0%{transform:rotate(0) translate(0,0)}25%{transform:rotate(38deg) translate(3px,-7px)}50%{transform:rotate(-30deg) translate(-4px,2px)}75%{transform:rotate(18deg) translate(2px,-4px)}100%{transform:rotate(0) translate(0,0)}}
  .die.rolling{animation:tumble .55s ease-in-out}
  .dice-palette{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
  .diepick{width:56px;text-align:center;cursor:pointer;background:none;border:none;font-family:inherit;padding:2px}
  .diepick svg{width:44px;height:44px;filter:drop-shadow(0 2px 3px rgba(23,16,9,.3));transition:transform .12s}
  .diepick:hover svg{transform:scale(1.14) rotate(-6deg)}
  .diepick span{display:block;font-family:var(--display);font-weight:700;font-size:.78rem;color:var(--titlered);letter-spacing:.05em;margin-top:1px}
  .dice-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:12px}
  .dice-controls label{font-variant:small-caps;font-weight:600;color:var(--titlered)}
  .dice-controls input{width:66px;padding:7px 8px;border:1px solid var(--line);border-radius:4px;background:#fffdf6;font-family:inherit;font-size:1rem;text-align:center}
  .btn{background:var(--titlered);color:#F7F2E5;border:1px solid var(--titlered);border-radius:4px;padding:8px 20px;cursor:pointer;font-family:var(--display);font-weight:700;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase}
  .btn:hover{background:var(--rulered)}
  .btn.ghosty{background:transparent;color:var(--titlered)}
  .btn.ghosty:hover{background:var(--tan)}
  .dice-hist{color:var(--muted);font-size:.94rem;margin-top:12px;line-height:1.55;text-align:center}
  /* — TimelineJS-style stage — */
  .tl-stage{position:relative;background:#1d130a;border:1px solid var(--gold);box-shadow:0 4px 18px rgba(23,16,9,.3);overflow:hidden;min-height:380px}
  .tl-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.34}
  .tl-shade{position:absolute;inset:0;background:linear-gradient(90deg, rgba(16,10,4,.88) 30%, rgba(16,10,4,.45) 65%, rgba(16,10,4,.25))}
  .tl-slide{position:relative;padding:34px 78px;max-width:700px;color:#F3E5C0;animation:tlfade .45s ease}
  @keyframes tlfade{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
  .tl-era{font-family:var(--display);font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ribbon);font-size:.85rem}
  .tl-head{font-family:var(--display);font-weight:900;font-size:2rem;line-height:1.15;margin:8px 0 12px;color:#FDF1DC}
  .tl-text{font-size:1.1rem;line-height:1.65;color:#eadfc6}
  .tl-more{display:inline-block;margin-top:14px;color:#ffd968;font-family:var(--display);font-weight:700;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-bottom:1px dotted #ffd968}
  .tl-arrow{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:1px solid var(--gold-bright);
    background:rgba(23,16,9,.65);color:#F3E5C0;font-size:1.15rem;cursor:pointer;z-index:3}
  .tl-arrow:hover{background:var(--titlered)}
  .tl-prev{left:12px}.tl-next{right:12px}
  .tl-nav{position:relative;background:var(--paper);border:1px solid var(--line);border-top:none;padding:20px 18px 12px}
  .tl-track{position:relative;height:2px;background:linear-gradient(90deg,var(--gold),var(--titlered),var(--gold));margin:16px 8px 6px}
  .tl-marker{position:absolute;top:50%;transform:translate(-50%,-50%);width:15px;height:15px;border-radius:50%;background:var(--paper);border:3px solid var(--gold);cursor:pointer;padding:0}
  .tl-marker.active{background:var(--titlered);border-color:var(--titlered);box-shadow:0 0 0 4px rgba(88,24,13,.2)}
  .tl-flag{position:absolute;transform:translateX(-50%);top:-24px;font-family:var(--display);font-weight:700;font-size:.66rem;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);white-space:nowrap;cursor:pointer;background:none;border:none}
  .tl-flag.active{color:var(--titlered)}
  .tl-count{text-align:center;color:var(--muted);font-size:.85rem;margin-top:8px;font-variant:small-caps;letter-spacing:.08em}
  @media (max-width:760px){.tl-slide{padding:24px 46px}.tl-head{font-size:1.5rem}.tl-flag{display:none}.tl-flag.active{display:block}.tl-arrow{width:34px;height:34px;font-size:1rem}.tl-prev{left:6px}.tl-next{right:6px}}
  /* — NPC gallery — */
  .npc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
  .npc-card{background:var(--card);border:1px solid var(--gold);box-shadow:0 2px 8px rgba(36,26,16,.12);cursor:pointer;overflow:hidden;transition:transform .15s, box-shadow .15s}
  .npc-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(36,26,16,.18)}
  .npc-portrait{width:100%;height:190px;object-fit:cover;display:block;border-bottom:3px solid var(--titlered)}
  .npc-medallion{height:190px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 38%, #3a2415, #1d130a);border-bottom:3px solid var(--titlered)}
  .npc-medallion span{font-family:var(--display);font-weight:900;font-size:3.4rem;color:var(--gold-bright);border:3px double var(--gold);border-radius:50%;width:104px;height:104px;display:flex;align-items:center;justify-content:center}
  .npc-info{padding:12px 14px}
  .npc-name{font-family:var(--display);font-weight:900;color:var(--titlered);font-size:1.16rem;line-height:1.2}
  .npc-role{color:var(--muted);font-variant:small-caps;letter-spacing:.07em;font-size:.92rem;margin-top:2px}
  .npc-where{color:var(--body-ink);font-size:.95rem;margin-top:6px;font-style:italic}
  /* — Solbera pass: the actual 5e typefaces (free clones of Bookmania / Mrs Eaves SC / Modesto / Scala Sans) — */
  :root{--body:'Bookinsanity','EB Garamond',Georgia,serif; --display:'Mr Eaves Small Caps','Cinzel',serif}
  header.site h1{font-family:'Nodesto Caps Condensed','Cinzel',serif;font-weight:400;font-size:3.3rem;letter-spacing:.1em}
  article.reader h2{font-weight:400;font-size:2.35rem}
  aside h3, main h3, .panel h3{font-weight:400;border-bottom:1px solid var(--titlered)}
  .card h4{font-weight:400;font-size:1.34rem}
  .sb-name{font-weight:400;font-size:1.52rem}
  .npc-name{font-weight:400}
  .tl-head{font-weight:400;font-size:2.15rem}
  .tl-era,.tl-more,.tl-flag,.pin,.diepick span{font-weight:400}
  .tabs button,.btn,.back{font-weight:400;letter-spacing:.08em}
  .dice-total{font-weight:400}
  .dice-total small{font-family:'Scaly Sans Caps','Scaly Sans',sans-serif}
  .die .val{font-family:'Scaly Sans',sans-serif;font-weight:700}
  .dice-hist{font-family:'Scaly Sans',sans-serif;font-size:.9rem}
  .sb-row{font-family:'Scaly Sans',sans-serif;font-size:.99rem}
  .sb-k{font-family:'Scaly Sans Caps','Scaly Sans',sans-serif;font-weight:400;letter-spacing:.02em}
  .sb-v{color:var(--titlered)}
  .card .meta, article.reader .meta{font-family:'Scaly Sans Caps','Scaly Sans',sans-serif;letter-spacing:.05em;text-transform:none}
  .npc-medallion span{font-family:'Nodesto Caps Condensed','Cinzel',serif;font-weight:400}
  article.reader .body > p:first-of-type::first-letter{font-family:'Nodesto Caps Condensed','Cinzel',serif;font-weight:400}
  article.reader .body p{font-size:1.05rem;line-height:1.6}
  .tl-count{font-family:'Scaly Sans Caps','Scaly Sans',sans-serif;font-variant:normal}
  /* — Centered-article layout: the page centers on the ARTICLE column.
     The articles view becomes a mirrored three-column grid (sidebar 250 ·
     article 776 · empty 250) inside a block wider than .wrap, so the article
     sits dead-center under the masthead and above the footer, with Search /
     Categories / Type / Tags hanging off its left. The right column is
     deliberately empty — the mirror that makes the centering honest.
     Below 1380px viewport there isn't room for the mirror: single centered
     column, sidebar stacked above the article at the same width. — */
  .tabs{justify-content:center}
  .layout{display:grid;grid-template-columns:250px 776px 250px;gap:22px;width:min(1320px,calc(100vw - 32px));margin-left:50%;transform:translateX(-50%)}
  .layout aside{grid-column:1}
  .layout main{grid-column:2;min-width:0}
  @media (max-width:1380px){
    .layout{display:block;width:auto;margin-left:0;transform:none}
    .layout aside{max-width:776px;margin:0 auto 18px}
  }
  article.reader .body table.md-table td{overflow-wrap:break-word}
</style>
</head>
<body>
<header class="site">
  <h1 id="siteTitle">World Codex</h1>
  <div class="orn">◆ ◆ ◆</div>
  <p>The world, as the players are allowed to know it.</p>
</header>
<div class="wrap">
  <div class="tabs">
    <button id="tab-articles" class="active" onclick="showTab('articles')">Articles</button>
    <button id="tab-timeline" onclick="showTab('timeline')">Timeline</button>
    <button id="tab-npcs" onclick="showTab('npcs')">NPCs</button>
    <button id="tab-statblocks" onclick="showTab('statblocks')">Statblocks</button>
    <button id="tab-dice" onclick="showTab('dice')">Dice Roller</button>
  </div>
  <div id="view-articles">
    <div class="layout">
      <aside>
        <div class="box">
          <h3>Search</h3>
          <input type="search" id="q" placeholder="Search articles…" oninput="renderList()">
        </div>
        <div class="box">
          <h3>Categories</h3>
          <div id="cats"></div>
        </div>
        <div class="box">
          <h3>Type</h3>
          <select id="typeFilter" onchange="renderList()"><option value="">All types</option></select>
        </div>
        <div class="box">
          <h3>Tags</h3>
          <div id="tags"></div>
        </div>
      </aside>
      <main>
        <div id="list"></div>
        <div id="reader" style="display:none"></div>
      </main>
    </div>
  </div>
  <div id="view-timeline" style="display:none"></div>
  <div id="view-npcs" style="display:none">
    <div id="npcList"></div>
    <div id="npcReader" style="display:none"></div>
  </div>
  <div id="view-statblocks" style="display:none"></div>
  <div id="view-dice" style="display:none">
    <div class="panel">
      <h3>Dice Roller</h3>
      <div class="dice-total"><small>Total</small><span id="diceTotal">—</span></div>
      <div class="dice-tray" id="diceTray"><span class="dice-empty">Tap a die below to add it to the tray and roll it.</span></div>
      <div class="dice-palette" id="dicePalette"></div>
      <div class="dice-controls">
        <label>Modifier <input type="number" id="diceMod" value="0" oninput="updTotal()"></label>
        <button class="btn" onclick="rollAll()">Roll all</button>
        <button class="btn ghosty" onclick="clearTray()">Clear tray</button>
      </div>
      <div class="dice-hist" id="diceHist"></div>
    </div>
  </div>
  <footer class="site">
    <div class="orn">◆ ◆ ◆</div>
    <div id="footLine">World Codex — kept by the DM, shared with the party.</div>
  </footer>
</div>
<script src="player-data.js"></script>
<script>
const DATA = window.PLAYER_DATA;
const SETTINGS = DATA.settings || {};
const SITE_TITLE = SETTINGS.siteTitle || "World Codex";
document.title = SITE_TITLE;
document.getElementById("siteTitle").textContent = SITE_TITLE;
if (SETTINGS.footerText) document.getElementById("footLine").textContent = SETTINGS.footerText;
const byTitle = {}; DATA.articles.forEach(a => byTitle[a.title] = a);
const catName = id => (DATA.categories.find(c => c.id === id) || {}).name || "Uncategorised";
let activeCat = null, activeTag = null;

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
const IMG_FILE = /^[a-zA-Z0-9][a-zA-Z0-9._-]*\.(jpg|jpeg|png|gif|webp)$/i;
function linkify(text){
  // [[Exact Title]] or [[Exact Title|display text]] — the pipe form lets prose
  // say "Patron" while linking to the article titled "Patrons".
  return esc(text).replace(/\[\[([^\]]+)\]\]/g, (m, t) => {
    const parts = t.split("|");
    const target = parts[0].trim(), label = (parts.length > 1 ? parts[1] : parts[0]).trim();
    return byTitle[target] ? `<a class="xlink" onclick="openArticle(${byTitle[target].id})">${esc(label)}</a>` : esc(label);
  });
}
function imgify(html){
  // [img:filename] tokens (written by the DM Desk) become images from images/
  return html.replace(/\[img:([^\]]+)\]/g, (m, name) =>
    IMG_FILE.test(name.trim()) ? `<img class="body-img" src="images/${name.trim()}" alt="">` : esc(m));
}
const sbByName = {};
(DATA.statblocks || []).forEach(s => { sbByName[s.name] = s; });
function sbCard(s){
  return `<div class="sb-card"><div class="sb-name">${esc(s.name)}</div><div class="sb-rule"></div>` +
    (s.rows || []).map(r => `<div class="sb-row"><span class="sb-k">${esc(r.label)}</span><span class="sb-v">${esc(r.value)}</span></div>`).join("") +
    `</div>`;
}
const sbById = {};
(DATA.statblocks || []).forEach(s => { sbById[s.id] = s; });
function sbify(html){
  // [sb:Exact Name] tokens become statblock cards (player-visible blocks only)
  return html.replace(/\[sb:([^\]]+)\]/g, (m, name) =>
    sbByName[name.trim()] ? sbCard(sbByName[name.trim()]) : esc(m));
}
/* — Article body renderer ("markdown-lite") —
   Blocks: paragraphs (blank-line separated; single newlines stay line breaks),
   # / ## / ### headings, > quotes (a last line starting with — becomes the
   attribution), >> read-aloud boxes, - bullets, 1. numbered lists, --- dividers,
   | pipe tables |, and the standalone [img:file] / [sb:Name] token lines.
   Inline: **bold**, *italic*, ***both***, [[links]] incl. [[Title|text]].
   Articles with 2+ headings get an automatic Contents box before heading one. */
function mdInline(html){ // runs on already linkified HTML
  return html
    .replace(/\*\*\*([^*]+)\*\*\*/g, "<strong><em>$1</em></strong>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
}
const mdPipe = t => sbify(imgify(mdInline(linkify(t))));
function mdSpecial(s){
  return /^#{1,3}(?!#)\s*\S/.test(s) || s === "---" || s.startsWith("|") || s.startsWith(">")
    || /^[-*]\s/.test(s) || /^\d+\.\s/.test(s)
    || /^\[img:[^\]]+\]$/.test(s) || /^\[sb:[^\]]+\]$/.test(s);
}
function mdRow(s){ return s.replace(/^\||\|$/g, "").split("|").map(c => c.trim()); }
function renderBody(text){
  const lines = text.split("\n");
  const out = []; const headings = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i].trim();
    if (!line) { i++; continue; }
    if (/^\[img:[^\]]+\]$/.test(line) || /^\[sb:[^\]]+\]$/.test(line)) { out.push(mdPipe(line)); i++; continue; }
    const hm = line.match(/^(#{1,3})(?!#)\s*(\S.*)$/);
    if (hm) {
      const lvl = hm[1].length, id = "sec-" + headings.length;
      headings.push({ lvl, text: hm[2], id });
      out.push(`<h${lvl + 2} class="md-h${lvl}" id="${id}">${mdPipe(hm[2])}</h${lvl + 2}>`); i++; continue;
    }
    if (line === "---") { out.push('<div class="md-hr">◆ ◆ ◆</div>'); i++; continue; }
    if (line.startsWith("|") && i + 1 < lines.length && /^\|[\s:|-]+\|$/.test(lines[i + 1].trim())) {
      const head = mdRow(line); i += 2; const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) { rows.push(mdRow(lines[i].trim())); i++; }
      out.push(`<table class="md-table"><thead><tr>${head.map(c => `<th>${mdPipe(c)}</th>`).join("")}</tr></thead><tbody>${
        rows.map(r => `<tr>${r.map(c => `<td>${mdPipe(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
      continue;
    }
    if (line.startsWith(">")) {
      const aloud = line.startsWith(">>"); const q = [];
      while (i < lines.length && lines[i].trim().startsWith(">")) { q.push(lines[i].trim().replace(/^>>?\s?/, "")); i++; }
      let attr = "";
      if (!aloud && q.length > 1 && /^—\s*/.test(q[q.length - 1])) attr = q.pop().replace(/^—\s*/, "");
      const inner = mdPipe(q.join("\n"));
      out.push(aloud ? `<div class="aloud">${inner}</div>`
        : `<blockquote class="md-quote">${inner}${attr ? `<span class="qattr">— ${esc(attr)}</span>` : ""}</blockquote>`);
      continue;
    }
    if (/^[-*]\s+/.test(line) || /^\d+\.\s+/.test(line)) {
      const ordered = /^\d/.test(line); const items = [];
      const re = ordered ? /^\d+\.\s+/ : /^[-*]\s+/;
      while (i < lines.length && re.test(lines[i].trim())) { items.push(lines[i].trim().replace(re, "")); i++; }
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag} class="md-list">${items.map(t => `<li>${mdPipe(t)}</li>`).join("")}</${tag}>`);
      continue;
    }
    const plines = [];
    while (i < lines.length && lines[i].trim() && !mdSpecial(lines[i].trim())) { plines.push(lines[i].trim()); i++; }
    if (plines.length) out.push(`<p>${mdPipe(plines.join("\n"))}</p>`);
  }
  if (headings.length >= 2) {
    const tocHeads = headings.filter(h => h.lvl <= 2); // minor (###) heads stay out of the Contents
    const toc = `<div class="toc"><div class="toc-h">Contents</div>${tocHeads.map(h =>
      `<a class="toc-l${h.lvl}" onclick="document.getElementById('${h.id}').scrollIntoView({behavior:'smooth'})">${esc(h.text)}</a>`).join("")}</div>`;
    const idx = out.findIndex(b => b.startsWith("<h"));
    if (idx >= 0) out.splice(idx, 0, toc); else out.push(toc);
  }
  return out.join("");
}
function renderStatblocks(){
  const el = document.getElementById("view-statblocks");
  const items = (DATA.statblocks || []).slice().sort((a,b) => a.name.localeCompare(b.name));
  el.innerHTML = `<div class="panel"><h3>Statblocks</h3>` +
    (items.length ? items.map(sbCard).join("") : `<p class="empty">No statblocks yet.</p>`) + `</div>`;
}
function showTab(name){
  ["articles","timeline","npcs","statblocks","dice"].forEach(t => {
    document.getElementById("view-"+t).style.display = t === name ? "" : "none";
    document.getElementById("tab-"+t).classList.toggle("active", t === name);
  });
  if (name === "timeline") renderTimeline();
  if (name === "npcs") renderNpcs();
  if (name === "statblocks") renderStatblocks();
}
/* — NPCs (public face only — DM fields never reach this page's data) — */
function renderNpcs(){
  document.getElementById("npcReader").style.display = "none";
  const el = document.getElementById("npcList"); el.style.display = "";
  const items = (DATA.npcs || []).slice().sort((a,b) => a.name.localeCompare(b.name));
  el.innerHTML = items.length ? `<div class="npc-grid">` + items.map(n => `
    <div class="npc-card" onclick="openNpc(${n.id})">
      ${n.image && IMG_FILE.test(n.image) ? `<img class="npc-portrait" src="images/${n.image}" alt="">` : `<div class="npc-medallion"><span>${esc((n.name || "?").trim().charAt(0).toUpperCase())}</span></div>`}
      <div class="npc-info">
        <div class="npc-name">${esc(n.name)}</div>
        ${n.role ? `<div class="npc-role">${esc(n.role)}</div>` : ''}
        ${n.location ? `<div class="npc-where">${esc(n.location)}</div>` : ''}
      </div>
    </div>`).join("") + `</div>`
    : `<div class="panel"><p class="empty">No NPCs yet. The party hasn't met anyone the DM wants written down.</p></div>`;
}
function openNpc(id){
  const n = (DATA.npcs || []).find(x => x.id === id); if (!n) return;
  document.getElementById("npcList").style.display = "none";
  const r = document.getElementById("npcReader"); r.style.display = "";
  const sb = n.statblockId ? sbById[n.statblockId] : null;
  r.innerHTML = `
    <button class="back" onclick="renderNpcs()">← All NPCs</button>
    <article class="reader">
      <h2>${esc(n.name)}</h2>
      <div class="meta">${n.role ? esc(n.role) : ''}${n.location ? ` · ${esc(n.location)}` : ''}${n.met ? ` · First met: ${esc(n.met)}` : ''}</div>
      ${n.image && IMG_FILE.test(n.image) ? `<img class="cover-img" src="images/${n.image}" alt="">` : ''}
      <div class="body">${(n.publicNotes || "").split(/\n\s*\n/).filter(Boolean).map(p => `<p>${linkify(p)}</p>`).join("") || '<p class="empty">Nothing written yet.</p>'}</div>
      ${sb ? sbCard(sb) : ''}
    </article>`;
  window.scrollTo(0, 0);
}
function renderCats(){
  const el = document.getElementById("cats");
  let h = `<button class="cat-btn ${activeCat===null?'active':''}" onclick="setCat(null)">All articles<span class="n">${DATA.articles.length}</span></button>`;
  [...DATA.categories].sort((a,b)=>a.sortOrder-b.sortOrder).forEach(c => {
    const n = DATA.articles.filter(a => a.categoryId === c.id).length;
    h += `<button class="cat-btn ${activeCat===c.id?'active':''}" onclick="setCat(${c.id})">${esc(c.name)}<span class="n">${n}</span></button>`;
  });
  el.innerHTML = h;
}
function renderTags(){
  const all = [...new Set(DATA.articles.flatMap(a => a.tags))].sort();
  document.getElementById("tags").innerHTML = all.map(t =>
    `<button class="tag ${activeTag===t?'active':''}" onclick="setTag('${esc(t)}')">${esc(t)}</button>`).join("");
}
function renderTypes(){
  const sel = document.getElementById("typeFilter");
  [...new Set(DATA.articles.map(a => a.type))].sort().forEach(t => {
    const o = document.createElement("option"); o.value = t; o.textContent = t; sel.appendChild(o);
  });
}
function setCat(id){ activeCat = id; renderCats(); renderList(); }
function setTag(t){ activeTag = activeTag === t ? null : t; renderTags(); renderList(); }
function filtered(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const ty = document.getElementById("typeFilter").value;
  return DATA.articles.filter(a =>
    (activeCat === null || a.categoryId === activeCat) &&
    (!ty || a.type === ty) &&
    (!activeTag || a.tags.includes(activeTag)) &&
    (!q || (a.title + " " + a.summary + " " + a.body + " " + a.tags.join(" ")).toLowerCase().includes(q))
  ).sort((a,b) => (b.pinned - a.pinned) || a.title.localeCompare(b.title));
}
function renderList(){
  document.getElementById("reader").style.display = "none";
  const el = document.getElementById("list"); el.style.display = "";
  const items = filtered();
  el.innerHTML = items.length ? items.map(a => `
    <div class="card" onclick="openArticle(${a.id})">
      ${a.image && IMG_FILE.test(a.image) ? `<img class="card-img" src="images/${a.image}" alt="">` : ''}
      ${a.pinned ? '<div class="pin">★ Featured</div>' : ''}
      <h4>${esc(a.title)}</h4>
      <div class="meta">${esc(a.type)} · ${esc(catName(a.categoryId))}</div>
      <p>${esc(a.summary)}</p>
    </div>`).join("") : '<div class="empty">No articles match. Try a different search.</div>';
}
function openArticle(id){
  const a = DATA.articles.find(x => x.id === id); if (!a) return;
  document.getElementById("list").style.display = "none";
  const r = document.getElementById("reader"); r.style.display = "";
  r.innerHTML = `
    <button class="back" onclick="renderList()">← All articles</button>
    <article class="reader">
      <h2>${esc(a.title)}</h2>
      <div class="meta">${esc(a.type)} · ${esc(catName(a.categoryId))} · ${a.tags.map(t => `<span class="tag" onclick="setTag('${esc(t)}');renderList()">${esc(t)}</span>`).join(" ")}</div>
      ${a.image && IMG_FILE.test(a.image) ? `<img class="cover-img" src="images/${a.image}" alt="">` : ''}
      <p class="summary">${esc(a.summary)}</p>
      <div class="body">${renderBody(a.body)}</div>
    </article>`;
  window.scrollTo(0, 0);
}
/* — Timeline (TimelineJS-style slides over a marker nav strip) — */
let tlIdx = 0;
function tlEvents(){ return [...DATA.timeline].sort((a,b) => a.sortKey - b.sortKey); }
function renderTimeline(){
  const el = document.getElementById("view-timeline");
  const evs = tlEvents();
  if (!evs.length) { el.innerHTML = `<div class="panel"><p class="empty">No timeline events yet.</p></div>`; return; }
  tlIdx = Math.max(0, Math.min(tlIdx, evs.length));
  el.innerHTML = `
    <div class="tl-stage" id="tlStage"></div>
    <div class="tl-nav">
      <div class="tl-track" id="tlTrack"></div>
      <div class="tl-count" id="tlCount"></div>
    </div>`;
  tlShow(tlIdx);
}
function tlShow(i){
  const evs = tlEvents();
  tlIdx = Math.max(0, Math.min(i, evs.length));
  const stage = document.getElementById("tlStage");
  const total = evs.length + 1;
  let bg = "", era, head, text, more = "";
  if (tlIdx === 0) {
    era = SITE_TITLE; head = "Timeline";
    text = "The history of the world, as the players are allowed to know it. Walk the ages with the arrows, or jump with the markers below.";
    const first = evs[0] && evs[0].articleId ? DATA.articles.find(a => a.id === evs[0].articleId) : null;
    if (first && first.image) bg = first.image;
  } else {
    const e = evs[tlIdx - 1];
    era = e.whenLabel || ""; head = e.title; text = e.description || "";
    const art = e.articleId ? DATA.articles.find(a => a.id === e.articleId) : null;
    if (art && art.image) bg = art.image;
    if (art) more = `<a class="tl-more" onclick="showTab('articles');openArticle(${art.id})">Read the article →</a>`;
  }
  stage.innerHTML = `
    ${bg ? `<div class="tl-bg" style="background-image:url('images/${bg}')"></div><div class="tl-shade"></div>` : ''}
    <div class="tl-slide">
      <div class="tl-era">${esc(era)}</div>
      <div class="tl-head">${esc(head)}</div>
      <div class="tl-text">${esc(text)}</div>
      ${more}
    </div>
    <button class="tl-arrow tl-prev" onclick="tlShow(tlIdx-1)" ${tlIdx === 0 ? 'disabled style="opacity:.35"' : ''}>‹</button>
    <button class="tl-arrow tl-next" onclick="tlShow(tlIdx+1)" ${tlIdx === evs.length ? 'disabled style="opacity:.35"' : ''}>›</button>`;
  const track = document.getElementById("tlTrack");
  track.innerHTML = evs.map((e, j) => {
    const pct = evs.length === 1 ? 50 : 5 + (j / (evs.length - 1)) * 90;
    const shift = j === 0 ? "-6%" : j === evs.length - 1 ? "-94%" : "-50%";
    return `<button class="tl-flag ${tlIdx === j + 1 ? 'active' : ''}" style="left:${pct}%;transform:translateX(${shift})" onclick="tlShow(${j + 1})">${esc(e.whenLabel || e.title)}</button>
            <button class="tl-marker ${tlIdx === j + 1 ? 'active' : ''}" style="left:${pct}%" onclick="tlShow(${j + 1})" aria-label="${esc(e.title)}"></button>`;
  }).join("");
  document.getElementById("tlCount").textContent = tlIdx === 0 ? `Title slide · ${total} slides` : `${esc(evs[tlIdx - 1].title)} · slide ${tlIdx + 1} of ${total}`;
}
/* — Dice roller (Google-style: palette → tray → tumble) — */
const DIE_DEFS = [
  { s: 4,   fill: "#2e5e4e", shape: '<polygon points="50,5 95,90 5,90"/>' },
  { s: 6,   fill: "#33526e", shape: '<rect x="13" y="13" width="74" height="74" rx="11"/>' },
  { s: 8,   fill: "#6e3352", shape: '<polygon points="50,3 93,50 50,97 7,50"/>' },
  { s: 10,  fill: "#8a5a1d", shape: '<polygon points="50,3 91,37 73,95 27,95 9,37"/>' },
  { s: 12,  fill: "#4a336e", shape: '<polygon points="50,3 96,36 79,91 21,91 4,36"/>' },
  { s: 20,  fill: "#9C2B1B", shape: '<polygon points="50,2 91,26 91,74 50,98 9,74 9,26"/>' },
  { s: 100, fill: "#3d3730", shape: '<polygon points="50,2 69,9 85,22 96,40 96,60 85,78 69,91 50,98 31,91 15,78 4,60 4,40 15,22 31,9"/>' }
];
const dieDef = s => DIE_DEFS.find(d => d.s === s);
function dieSVG(s){
  const d = dieDef(s);
  return `<svg viewBox="0 0 100 100"><g fill="${d.fill}" stroke="#171009" stroke-width="2.5">${d.shape}</g>` +
    `<g transform="translate(50 50) scale(.56) translate(-50 -50)" fill="rgba(255,255,255,.17)" stroke="rgba(0,0,0,.28)" stroke-width="2">${d.shape}</g></svg>`;
}
let tray = [], diceHist = [];
const rollOne = s => 1 + Math.floor(Math.random() * s);
function renderPalette(){
  document.getElementById("dicePalette").innerHTML = DIE_DEFS.map(d =>
    `<button class="diepick" onclick="addDie(${d.s})">${dieSVG(d.s)}<span>d${d.s}</span></button>`).join("");
}
function renderTray(){
  const el = document.getElementById("diceTray");
  el.innerHTML = tray.length ? tray.map((d, i) => `
    <div class="die" id="die-${i}" onclick="removeDie(${i})" title="Tap to remove">
      ${dieSVG(d.sides)}
      <div class="val ${d.value === d.sides ? 'crit' : d.value === 1 ? 'fumble' : ''}">${d.value}</div>
    </div>`).join("")
    : `<span class="dice-empty">Tap a die below to add it to the tray and roll it.</span>`;
  updTotal();
}
function updTotal(){
  const mod = +document.getElementById("diceMod").value || 0;
  const sum = tray.reduce((a, d) => a + d.value, 0);
  document.getElementById("diceTotal").textContent = tray.length ? (sum + mod) : "—";
}
function tumble(indices, done){
  const tick = setInterval(() => {
    indices.forEach(i => { if (tray[i]) tray[i].value = rollOne(tray[i].sides); });
    renderTray();
    indices.forEach(i => { const n = document.getElementById("die-" + i); if (n) n.classList.add("rolling"); });
  }, 70);
  setTimeout(() => { clearInterval(tick); indices.forEach(i => { if (tray[i]) tray[i].value = rollOne(tray[i].sides); }); renderTray(); done && done(); }, 580);
}
function logRoll(){
  if (!tray.length) return;
  const mod = +document.getElementById("diceMod").value || 0;
  const groups = {};
  tray.forEach(d => { (groups[d.sides] = groups[d.sides] || []).push(d.value); });
  const parts = Object.keys(groups).sort((a,b) => a - b).map(s => `${groups[s].length}d${s}[${groups[s].join(",")}]`);
  const total = tray.reduce((a, d) => a + d.value, 0) + mod;
  diceHist.unshift(parts.join(" + ") + (mod ? ` ${mod > 0 ? "+" : "−"} ${Math.abs(mod)}` : "") + ` = ${total}`);
  document.getElementById("diceHist").innerHTML = diceHist.slice(0, 6).map(esc).join("<br>");
}
function addDie(s){
  tray.push({ sides: s, value: rollOne(s) });
  renderTray();
  tumble([tray.length - 1], logRoll);
}
function removeDie(i){ tray.splice(i, 1); renderTray(); }
function rollAll(){ if (!tray.length) return; tumble(tray.map((_, i) => i), logRoll); }
function clearTray(){ tray = []; renderTray(); }
renderPalette();
renderCats(); renderTags(); renderTypes(); renderList();
</script>
</body>
</html>
